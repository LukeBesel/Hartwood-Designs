<text x="610.2" y="197.5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5C4636" text-anchor="middle">code, problem, count</text>
<rect x="505.2" y="323.5" width="210" height="70" rx="14" fill="#fff" stroke="#3A2A1F" stroke-width="2"/>
